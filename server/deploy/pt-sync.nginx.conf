# 安装到 Ubuntu 的 Nginx sites-available 后令 Xray 从本机 9443 转发。
# 访问日志只记方法、不含参数的 URI 和状态码；令牌、注册口令与请求体不进日志。
# __ERRORS_SNIPPET__ 换成服务器上现有的 Nginx 错误页片段路径。
log_format pt_sync_access '$request_method $uri $status';

limit_req_zone $server_name zone=pt_sync_enroll:1m rate=6r/m;

upstream pt_sync_backend {
    server 127.0.0.1:9191;
    keepalive 8;
}

server {
    listen 80;
    server_name __SYNC_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hk-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:9443 ssl http2;
    port_in_redirect off;
    server_name __SYNC_DOMAIN__;
    ssl_certificate /etc/nginx/hk-certificates/__SYNC_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/hk-certificates/__SYNC_DOMAIN__/privkey.pem;
    include __ERRORS_SNIPPET__;
    limit_req_status 429;
    access_log /var/log/nginx/pt-sync.access.log pt_sync_access;

    location = /v1/spaces {
        limit_req zone=pt_sync_enroll burst=3 nodelay;
        client_max_body_size 4k;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://pt_sync_backend;
    }

    location ~ ^/v1/spaces/[^/]+/watch$ {
        proxy_read_timeout 40s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://pt_sync_backend;
    }

    # 不能用 ^~：它会跳过下面的 watch 正则，长轮询会落回 120 秒通用超时。
    location /v1/ {
        client_max_body_size 72m;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://pt_sync_backend;
    }

    location / {
        return 404;
    }
}
